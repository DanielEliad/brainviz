x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 200
  restart: unless-stopped

services:
  brainviz-backend:
    <<: *hardening
    build: ./backend
    environment:
      BRAINVIZ_CORS_ORIGINS: ""
    volumes:
      - ./data:/app/data:ro
    tmpfs:
      - /tmp:size=64m
    mem_limit: 3g
    cpus: 2
    networks: [internal]

  brainviz-nginx:
    <<: *hardening
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    mem_limit: 256m
    cpus: 1
    depends_on:
      - brainviz-backend
    networks: [internal, public]

networks:
  internal:
    internal: true
  public: {}
