[project]
name = "brainviz-backend"
version = "1.0.0"
description = "BrainViz Graph Backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]==0.30.1",
    "numpy==2.1.0",
    "scipy==1.13.1",
    "h5py>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "h5py-stubs>=0.1.2",
]

